<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111b">
<title>UTOP-3D｜3D針球狀接線</title>
<link rel="stylesheet" href="./css/needle-ball-3d.css?v=5.1.3.19-needle-ball-v3-20260806">
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<header class="nb-header">
  <div class="nb-brand"><strong>🔵 3D針球狀</strong><span id="projectName">端子與接線立體檢視</span></div>
  <div class="nb-stats"><span id="deviceCount">0個模組</span><span id="wireCount">0條接線</span></div>
</header>
<nav class="nb-toolbar" aria-label="3D針球工具列">
  <button id="autoLayoutBtn" type="button">◎ 自動排列</button>
  <button id="groupLayoutBtn" type="button">◉ 設備分群</button>
  <button id="resetViewBtn" type="button">⌂ 重設視角</button>
  <button id="labelsBtn" class="is-active" type="button">🏷 名稱：開</button>
  <button id="portsBtn" class="is-active" type="button">✳ 端子：開</button>
  <button id="wiresBtn" class="is-active" type="button">〰 接線：開</button>
  <button id="flowBtn" class="is-active" type="button">➤ 訊號流動：開</button>
  <button id="circuitFocusBtn" type="button">🔗 完整迴路</button>
  <button id="focusClearBtn" type="button">◎ 顯示全部</button>
  <button id="groupLabelsBtn" class="is-active" type="button">🧭 群組名稱：開</button>
  <button id="saveLayoutBtn" type="button">💾 保存排列</button>
  <button id="pointerBtn" type="button">🔴 指揮棒</button>
  <label>模組大小 <input id="nodeSize" type="range" min="60" max="160" value="100"></label>
  <label>間距 <input id="spacing" type="range" min="70" max="220" value="130"></label>
  <button id="fullscreenBtn" type="button">⛶ 全畫面</button>
  <button id="refreshBtn" type="button">↻ 重新讀取</button>
</nav>
<main class="nb-main">
  <section class="nb-stage" id="stage">
    <div id="mount"></div>
    <div class="nb-pointer" id="presentationPointer" hidden></div>
    <div class="nb-help">拖空白旋轉｜右鍵平移｜滾輪縮放｜拖曳球體移動｜點模組後按「完整迴路」｜點接線聚焦｜P切換指揮棒</div>
    <div class="nb-empty" id="emptyState" hidden>
      <strong>目前沒有可顯示的設備</strong>
      <span>請回到UTOP-3D加入模組或建立接線，再按「重新讀取」。</span>
    </div>
  </section>
  <aside class="nb-inspector" id="inspector">
    <h2>選取資訊</h2>
    <div id="inspectorContent"><p>點選模組、端子或接線查看詳細資料。</p></div>
    <h3>顯示篩選</h3>
    <div class="nb-filter-grid">
      <label><input type="checkbox" data-filter="DI" checked> DI</label>
      <label><input type="checkbox" data-filter="DO" checked> DO</label>
      <label><input type="checkbox" data-filter="NO" checked> NO</label>
      <label><input type="checkbox" data-filter="NC" checked> NC</label>
      <label><input type="checkbox" data-filter="COM" checked> COM</label>
      <label><input type="checkbox" data-filter="POWER" checked> 電源</label>
      <label><input type="checkbox" data-filter="NETWORK" checked> 網路</label>
      <label><input type="checkbox" data-filter="OTHER" checked> 其他</label>
    </div>
  </aside>
</main>
<script type="module" src="./js/needle-ball-3d.js?v=5.1.3.19-needle-ball-v3-20260806"></script>
</body>
</html>
